name: Build Release APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Generate Upload Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fatorty App,O=Fatorty,C=LY"
          echo "storePassword=android" >> gradle.properties
          echo "keyPassword=android" >> gradle.properties
          echo "keyAlias=upload" >> gradle.properties
          echo "storeFile=my-upload-key.jks" >> gradle.properties
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon -PstorePassword=android -PkeyPassword=android -PkeyAlias=upload
      - name: Upload Official Release APK
        uses: actions/upload-artifact@v4
        with:
          name: fatorty-official-release
          path: app/build/outputs/apk/release/*.apk
